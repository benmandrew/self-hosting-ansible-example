name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ansible-core==2.21.1 ansible-lint==25.8.2
      - run: ansible-galaxy collection install -r requirements.yml
      # The playbook needs vault-encrypted secrets to exist. CI makes throwaway
      # ones; a real deployment runs the same script once and commits the result.
      - run: ./scripts/bootstrap.sh
      - run: make lint
