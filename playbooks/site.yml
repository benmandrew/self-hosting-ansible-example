---
- name: Deploy the server
  hosts: myhosts
  become: true
  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
  roles:
    - role: docker
      tags: docker
    - role: certs
      tags: certs
    - role: proxy
      tags: proxy
    - role: gitea
      tags: gitea
