---
- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      # community.docker's API modules talk to the daemon through requests.
      - python3-requests
    state: present

- name: Add Docker's apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    signed_by: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Create the shared proxy network
  community.docker.docker_network:
    name: "{{ proxy_network }}"
    state: present
